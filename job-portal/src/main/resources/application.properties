spring.application.name=job-portal

# Import local gitignored properties if present
spring.config.import=optional:classpath:application-local.properties

# Database Configuration (Reads from env vars or application-local.properties)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/job_portal}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Configuration (Auto-DDL generation - zero raw SQL)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# HikariCP Connection Pool Settings (Optimized for Serverless / Cloud DB)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=120000
spring.datasource.hikari.connection-timeout=20000

# JWT Security Settings (Reads from env var or application-local.properties)
app.jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
app.jwt.access-token-expiration-ms=900000
app.jwt.refresh-token-expiration-days=7

# Resend Email Configuration
app.resend.api-key=${RESEND_API_KEY:}
app.resend.from-email=${RESEND_FROM_EMAIL:onboarding@resend.dev}
app.otp.expiration-minutes=10
